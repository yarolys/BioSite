<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="500" r="200" fill="url(#accent)" opacity="0.1"/>
  <circle cx="1100" cy="100" r="150" fill="url(#accent)" opacity="0.05"/>

  <!-- Avatar placeholder -->
  <circle cx="200" cy="315" r="80" fill="url(#accent)" opacity="0.2"/>
  <circle cx="200" cy="285" r="30" fill="#64748b"/>
  <ellipse cx="200" cy="370" rx="45" ry="35" fill="#64748b"/>

  <!-- Text -->
  <text x="320" y="280" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#1e293b">Лысов Ярослав</text>
  <text x="320" y="350" font-family="Inter, Arial, sans-serif" font-size="32" fill="#6366f1">Python Backend Developer</text>
  <text x="320" y="400" font-family="Inter, Arial, sans-serif" font-size="24" fill="#64748b">г. Иркутск, Россия</text>

  <!-- URL -->
  <text x="320" y="500" font-family="Inter, Arial, sans-serif" font-size="28" fill="#94a3b8">yarolys.ru</text>
</svg>
